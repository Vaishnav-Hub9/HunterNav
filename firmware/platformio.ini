; HunterNav handlebar display receiver — ESP32-S3 + SPI TFT.
;
; Protocol contract: app/src/main/java/com/hunternav/display/transport/FrameProtocol.kt
; (keep include/frame_protocol.h in sync; test/protocol_test.cpp cross-checks both).
;
; The phone connects TO this device's WebSocket server (soft-AP default
; ws://192.168.4.1:81/display, or the LAN address when joined to home Wi-Fi) and pushes
; binary HNV1 messages: ~4 Hz JPEG image frames + ~10 Hz guidance metadata.

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bitbank2/JPEGDEC@^1.6.1
    links2004/WebSockets@^2.4.1
build_flags =
    ; ---- Display panel: fill these in once the board is identified (see board_config.h) ----
    ; Defaults below target a 240x240 ST7789 SPI panel (the initial resolution target).
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=8
    -D TFT_BL=5
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    ; ---- Protocol tuning ----
    ; Largest expected frame: JpegEncoder caps payloads at 96 KB + 36-byte header.
    -D HNV_MAX_JPEG_BYTES=102400
    -D HNV_META_STRIP=0
